 flr_swapraja.20.t:0 "Raja Lorenzo III Takes the Throne in Larantuka"
 flr_swapraja.20.d:0 "The regency of Antonius Belantran de Rosari has ended in Larantuka. The Dutch worked to divide the ten kakang principalities, but the election was unanimous once again, and Don Lorenzo III Diaz Vieira Godinho has taken up his house's kingdom, with Antonius staying at court as Raja Kedua."
 flr_swapraja.20.a:0 "Long live Raja Lorenzo III!"
 flr_swapraja.21.t:0 "The Wedding of Raja Lorenzo III"
 flr_swapraja.21.d:0 "In July 1938 Don Lorenzo III Diaz Vieira Godinho of Larantuka married Dona Martina Kinena Ximenes da Silva Diaz Vieira de Godinho. The wedding was celebrated in the Catholic rite, and the rajas and lords of Flores sent their gifts."
 flr_swapraja.21.a:0 "Long life to the raja and his queen!"
 flr_swapraja.22.t:0 "Constantinus Ngambut Becomes King of Manggarai"
 flr_swapraja.22.d:0 "Alexander Baroek has died without naming a crown prince. The Dewan Karaeng of Todo and Pongkor met to choose among the Catholic sons of the princes, and chose Constantinus Ngambut."
 flr_swapraja.22.a:0 "Long live the king!"
 flr_swapraja.23.t:0 "Don Paulus Becomes Raja of Sikka"
 flr_swapraja.23.d:0 "On 18 May 1954 Don Paulus Centis Ximenes da Silva was installed as Moang Ratu, Raja of Sikka, succeeding Don Thomas Ximenes da Silva. The Ten Sitting Lords gathered to witness the new raja take the throne."
 flr_swapraja.23.a:0 "Long live Moang Ratu Paulus!"

 FLR_federation_chair_modifier:0 "Chair of the Council of Rajas"
 FLR_federation_chair_modifier_desc:0 "The raja of this kingdom is the chair elected by the Council of Rajas of the federation."

 flr_swapraja.30.t:0 "The Council of Rajas Elects Larantuka"
 flr_swapraja.30.d:0 "The Council of Rajas of the federation has elected a new chair after the term of Don Thomas of Sikka. The raja of Larantuka takes the chair."
 flr_swapraja.30.a:0 "The Council has voted."
 flr_swapraja.31.t:0 "The Council of Rajas Elects Manggarai"
 flr_swapraja.31.d:0 "The Council of Rajas of the federation has elected the king of Manggarai as its new chair."
 flr_swapraja.31.a:0 "The Council has voted."
 flr_swapraja.32.t:0 "The Council of Rajas Elects Sikka"
 flr_swapraja.32.d:0 "The Council of Rajas of the federation has elected the raja of Sikka as its chair once more."
 flr_swapraja.32.a:0 "The Council has voted."

 FLR_council_of_rajas:0 "Council of Rajas"
 FLR_council_of_rajas_desc:0 "The Council of Rajas runs the daily government of the federation, and elects its chair from among its members."
 FLR_representative_council:0 "People's Representative Council"
 FLR_representative_council_desc:0 "An elected council, with one member for every 30,000 people and one for each smaller kingdom, sits beside the Council of Rajas."
 FLR_regional_secretariat:0 "Regional Secretariat"
 FLR_regional_secretariat_desc:0 "A regional secretariat carries out the decisions of the councils."
