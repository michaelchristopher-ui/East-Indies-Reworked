 FLR_catholic_state:0 "Catholic Kingdom"
 FLR_catholic_state_desc:0 "Catholicism is the faith of the court and the realm, carried here by Portuguese traders and Dominican friars. The church and the raja stand together."

 SKA_paulus_centis_ximenes_da_silva:0 "Don Paulus Centis Ximenes da Silva"
 SKA_paulus_centis_ximenes_da_silva_desc:0 "Moang Ratu, Raja of Sikka from 1954, successor to Don Thomas Ximenes da Silva."
 flr_swapraja.2.t:0 "Don Paulus Becomes Raja of Sikka"
 flr_swapraja.2.d:0 "On 18 May 1954 Don Paulus Centis Ximenes da Silva was installed as Moang Ratu, Raja of Sikka, succeeding Don Thomas Ximenes da Silva. The Ten Sitting Lords gathered to witness the new raja take the throne."
 flr_swapraja.2.a:0 "Long live Moang Ratu Paulus!"

 flr_swapraja.3.t:0 "The Wedding of Raja Lorenzo III"
 flr_swapraja.3.d:0 "In July 1938 Don Lorenzo III Diaz Vieira Godinho married Dona Martina Kinena Ximenes da Silva Diaz Vieira de Godinho. The wedding was celebrated in the Catholic rite, and the rajas and lords of Flores sent their gifts."
 flr_swapraja.3.a:0 "Long life to the raja and his queen!"

 MGR_constantinus_ngambut:0 "Constantinus Ngambut"
 MGR_constantinus_ngambut_desc:0 "King of Manggarai from 1949, chosen by the Dewan Karaeng after the death of Alexander Baroek, who left no crown prince."
 flr_swapraja.4.t:0 "Constantinus Ngambut Becomes King of Manggarai"
 flr_swapraja.4.d:0 "Alexander Baroek has died without naming a crown prince. The Dewan Karaeng of Todo and Pongkor met to choose among the Catholic sons of the princes, and chose Constantinus Ngambut."
 flr_swapraja.4.a:0 "Long live the king!"

 LRT_servus:0 "Johannes Servus Diaz Vieira Godinho"
 LRT_servus_desc:0 "Raja Emeritus of Larantuka, the elder of the House of Diaz Vieira Godinho, who no longer rules but is still consulted at court."

 MGR_bagoeng:0 "Bagoeng"
 MGR_bagoeng_desc:0 "Raja Emeritus of Manggarai. He ruled the self-governing kingdom from Pongkor from 1924 to 1930 and now serves Baroek as Raja Bicara, the prime minister."

 MGR_keraeng_po:0 "Keraeng Po"
 MGR_keraeng_po_desc:0 "The King's Assistant, who handles the raja's business at Ruteng alongside Raja Bicara Bagoeng."

