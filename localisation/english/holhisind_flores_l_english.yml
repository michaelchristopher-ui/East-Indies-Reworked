 LRT_antonius_belantran_de_rosari:0 "Antonius Belantran de Rosari"
 LRT_antonius_belantran_de_rosari_desc:0 "Regent of Larantuka, governing in the name of the young Don Lorenzo III Diaz Vieira Godinho until the raja comes of age."
 LRT_lorenzo_iii:0 "Don Lorenzo III Diaz Vieira Godinho"
 LRT_lorenzo_iii_desc:0 "Raja of Larantuka of the House of Diaz Vieira Godinho, heir to the Catholic kingdom of East Flores. He married Dona Martina Kinena Ximenes da Silva Diaz Vieira de Godinho, and reigned until his death in 1982."

 LRT_raja_under_regency:0 "The Raja Under Regency"
 LRT_raja_under_regency_desc:0 "Our rightful raja, Don Lorenzo III Diaz Vieira Godinho, is not yet ready to rule. Until he takes the throne, Antonius Belantran de Rosari governs Larantuka as regent."

 flr_swapraja.1.t:0 "Raja Lorenzo III Takes the Throne"
 flr_swapraja.1.d:0 "The regency of Antonius Belantran de Rosari has come to an end. The Dutch worked to divide the ten kakang of Demon Lewo Pulo, but once again the election was unanimous. Before the Reinha Rosari chapel, Don Lorenzo III Diaz Vieira Godinho has taken up the rule of his house's kingdom."
 flr_swapraja.1.a:0 "Long live Raja Lorenzo III!"
 SKA_thomas_ximenes_da_silva:0 "Don Thomas Ximenes da Silva"
 SKA_thomas_ximenes_da_silva_desc:0 "Moang Ratu, Raja of Sikka. He sits at the head of the Ten Sitting Lords and their moang principalities."
 MGR_alexander_baroek:0 "Alexander Baroek"

 autonomy_federal_member:0 "Federated Swapraja"
 autonomy_federal_member_desc:0 "A self-governing native kingdom bound to its overlord by the Korte Verklaring. It keeps its raja and its own administration, but cannot go to war on its own."

 FLR_category_swapraja:0 "Swapraja of Nusa Tenggara Timur"
 FLR_category_swapraja_desc:0 "The rajas of Flores rule under the Korte Verklaring. We may recognise their kingdoms as federated members in their own right."
 FLR_recognise_larantuka:0 "Recognise the Kingdom of Larantuka"
 FLR_recognise_larantuka_desc:0 "Release Larantuka as a Federated Swapraja, governed by the regent Antonius Belantran de Rosari in the name of the young Don Lorenzo III."
 FLR_recognise_sikka:0 "Recognise the Kingdom of Sikka"
 FLR_recognise_sikka_desc:0 "Release Sikka as a Federated Swapraja under Moang Ratu, Raja Don Thomas Ximenes da Silva."
 FLR_recognise_manggarai:0 "Recognise the Kingdom of Manggarai"
 FLR_recognise_manggarai_desc:0 "Release Manggarai as a Federated Swapraja under Raja Alexander Baroek."

 LRT_regent_of_reinha_rosari:0 "Regent of the Reinha Rosari"
 LRT_regent_of_reinha_rosari_desc:0 "He rules in the young raja's name, not his own. The court stays loyal, but little gets done."
 LRT_lord_of_the_semana_santa:0 "Lord of the Semana Santa"
 LRT_lord_of_the_semana_santa_desc:0 "Every Holy Week the raja walks at the head of the Reinha Rosari procession, the heart of Catholic Larantuka."
 SKA_heir_of_the_lusitanian_rajas:0 "Heir of the Lusitanian Rajas"
 SKA_heir_of_the_lusitanian_rajas_desc:0 "The da Silva rajas trace their crown to Portuguese Catholic converts, and their court looks outward to the traders of the Flores Sea."
 MGR_king_over_the_principalities:0 "King over the Dalu Principalities"
 MGR_king_over_the_principalities_desc:0 "Elected in 1930 as Manggarai's first king by the Dewan Karaeng, the council of princes of Panga Adak Alo Todo and Panga Adak Enem Pongkor, with Dutch and Church backing, he rules over the karaeng of the dalu principalities, who were once his equals."

 LRT_demon_lewo_pulo:0 "Demon Lewo Pulo"
 LRT_demon_lewo_pulo_desc:0 "Raja Sira Demong Pagong Molang divided the realm into ten kakang principalities, sealed with a buffalo sacrifice. The raja holds the royal demesne around Larantuka and Lokea himself, and rules the ten kakang as Raja Koten Demon Lewo Pulo, and the ten kakang have never failed to elect a Diaz Vieira Godinho unanimously, however hard the Dutch pressed them to split."
 SKA_ten_principalities:0 "The Ten Principalities"
 SKA_ten_principalities_desc:0 "Ten principalities, each ruled by a moang, hold the land of Sikka beside the raja. Their goodwill makes his rule easy, and losing it makes his rule hard."
 MGR_the_38_principalities:0 "The 38 Dalu Principalities"
 MGR_the_38_principalities_desc:0 "Manggarai is a patchwork of thirty-eight dalu principalities, each ruled by a karaeng. Many of the karaeng were the raja's equals until the Dewan Karaeng of Todo and Pongkor elected him in 1930."

 LRT_category_demon_lewo_pulo:0 "Demon Lewo Pulo"
 LRT_category_demon_lewo_pulo_desc:0 "The ten kakang principalities of Larantuka, each ruled by its kakang, around the royal demesne that the raja holds directly. Hadung on Lembata and Boleng on Adonara stand above the rest, the two centres of the realm's '2x4' order.\n\nLoyal kakang principalities: §Y[?FLR_loyal_lords|0]§! / [?FLR_total_lords|0]"
 SKA_category_ten_principalities:0 "The Ten Principalities"
 SKA_category_ten_principalities_desc:0 "The ten sitting principalities of Sikka, each ruled by a moang.\n\nLoyal moang principalities: §Y[?FLR_loyal_lords|0]§! / [?FLR_total_lords|0]"
 MGR_category_the_38_principalities:0 "The 38 Dalu Principalities"
 MGR_category_the_38_principalities_desc:0 "The dalu principalities of Manggarai under the raja at Ruteng, each ruled by a karaeng.\n\nLoyal dalu principalities: §Y[?FLR_loyal_lords|0]§! / [?FLR_total_lords|0]"

 LRT_bind_kakang_hadung:0 "Summon the Kakang of Hadung"
 LRT_bind_kakang_hadung_desc:0 "Hadung on Lembata is one of the two senior kakang principalities. With it bound to the raja, Lamalera will follow."
 LRT_bind_kakang_boleng:0 "Summon the Kakang of Boleng"
 LRT_bind_kakang_boleng_desc:0 "Boleng on Adonara is one of the two senior kakang principalities. With it bound to the raja, Horowura will follow."
 LRT_bind_kakang_lamalera:0 "Summon the Kakang of Lamalera"
 LRT_bind_kakang_lamalera_desc:0 "The whaling coast of Lembata answers to Hadung before it answers to us."
 LRT_bind_kakang_horowura:0 "Summon the Kakang of Horowura"
 LRT_bind_kakang_horowura_desc:0 "Horowura on Adonara looks to Boleng for its lead."
 LRT_bind_kakang_pamakayo:0 "Summon the Kakang of Pamakayo"
 LRT_bind_kakang_pamakayo_desc:0 "Restore the bond with Pamakayo on Solor."
 LRT_bind_kakang_lewolein:0 "Summon the Kakang of Lewolein"
 LRT_bind_kakang_lewolein_desc:0 "Restore the bond with Lewolein on Solor."
 LRT_bind_kakang_wobo:0 "Summon the Kakang of Wobo"
 LRT_bind_kakang_wobo_desc:0 "Restore the bond with Wobo in eastern Flores."
 LRT_bind_kakang_mudakaputu:0 "Summon the Kakang of Mudakaputu"
 LRT_bind_kakang_mudakaputu_desc:0 "Restore the bond with Mudakaputu in eastern Flores."
 LRT_bind_kakang_lewingo:0 "Summon the Kakang of Lewingo"
 LRT_bind_kakang_lewingo_desc:0 "Restore the bond with Lewingo in eastern Flores."
 LRT_bind_kakang_lewotobi:0 "Summon the Kakang of Lewotobi"
 LRT_bind_kakang_lewotobi_desc:0 "Restore the bond with Lewotobi in eastern Flores."

 SKA_seat_principality_buang_bali:0 "Seat the Moang of the Principality of Buang Bali"
 SKA_seat_principality_buang_bali_desc:0 "The principality of the suku of Buang Bali, ruled by its moang, holds Wolokoli, Jang, Puho, Rohé, Dobo, Moro, Pau and Bao, with the sub-principalities of Tana Pu'ang, Kokek and Gai beneath it."
 SKA_seat_principality_maget_ili:0 "Seat the Moang of the Principality of Maget Ili"
 SKA_seat_principality_maget_ili_desc:0 "The principality of the suku of Maget Ili, ruled by its moang, holds Egong, Lere, Nata Koli, Hebing and Halé."
 SKA_seat_principality_mekeng:0 "Seat the Moang of the Principality of Mekeng"
 SKA_seat_principality_mekeng_desc:0 "The principality of the suku of Mekeng, ruled by its moang, holds Nitung, Kangae, Habi Gette and Habi Gahar."
 SKA_seat_principality_soget:0 "Seat the Moang of the Principality of Soget"
 SKA_seat_principality_soget_desc:0 "The principality of the suku of Soget, ruled by its moang, holds Warut, Krado, Hale Hebing, Natawatu Ipir, Hebar and Hepang."
 SKA_seat_principality_keupung:0 "Seat the Moang of the Principality of Keupung"
 SKA_seat_principality_keupung_desc:0 "The principality of the suku of Keupung, ruled by its moang, holds Kroa, Baomekot, Maget and Hiding Tadat."
 SKA_seat_principality_kroa:0 "Seat the Moang of the Principality of Kroa"
 SKA_seat_principality_kroa_desc:0 "The principality of the suku of Kroa, ruled by its moang, holds Kewa, Hewakroang, Kopang, Heo and Botang."
 SKA_seat_principality_darabogar:0 "Seat the Moang of the Principality of Darabogar"
 SKA_seat_principality_darabogar_desc:0 "The principality of the suku of Darabogar, ruled by its moang, holds Wutik, Arat, Tak and Gehak."
 SKA_seat_principality_kei_timu:0 "Seat the Moang of the Principality of Kei Timu"
 SKA_seat_principality_kei_timu_desc:0 "The principality of the suku of Kei Timu, ruled by its moang, holds Koting and Wolohuler."
 SKA_seat_principality_muhang:0 "Seat the Moang of the Principality of Muhang"
 SKA_seat_principality_muhang_desc:0 "The principality of the suku of Muhang, ruled by its moang, holds Rohe, Puho, Dokar, Natarkoli and Lere."
 SKA_seat_principality_wodong:0 "Seat the Moang of the Principality of Wodong"
 SKA_seat_principality_wodong_desc:0 "The principality of the suku of Wodong, ruled by its moang, holds Pogong, Bola, Ai Bura, Kokor and Watuwitir."

 MGR_win_over_the_principalities:0 "Win Over the Karaeng of the Dalu Principalities"
 MGR_win_over_the_principalities_desc:0 "Gifts, marriages and appointments bring the karaeng of a few more dalu principalities under the raja's authority."

